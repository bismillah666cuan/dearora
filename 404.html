<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Halaman tidak ditemukan — Dearora</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; background: #FCF9F7; color: #261C24; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; } p { color: #6E616B; margin: 0 0 1.25rem; }
    a { display: inline-block; background: #E85D75; color: #fff; font-weight: 700; text-decoration: none; padding: .8rem 1.75rem; border-radius: 999px; }
  </style>
</head>
<body style="visibility:hidden">
  <script>
    // Jaring pengaman: alamat ucapan /u/{kode} dialihkan ke halaman kartu (/u/?k={kode}).
    // Berlaku walaupun aturan "rewrites" di vercel.json belum aktif. Alamat lain tetap menampilkan halaman 404 ini.
    (function () {
      var m = /^\/u\/([A-Za-z0-9]{10,40})\/?$/.exec(location.pathname);
      if (m) { location.replace('/u/?k=' + m[1]); return; }
      document.body.style.visibility = 'visible';
    })();
  </script>
  <main>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang kamu tuju tidak tersedia atau sudah dipindahkan.</p>
    <a href="/">Ke beranda Dearora</a>
  </main>
</body>
</html>
